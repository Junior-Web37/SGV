# =============================================
# DEFAULT PROFILE (local dev - MariaDB + Flyway-managed schema)
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.ignore-missing-migrations=true
spring.main.web-application-type=none
spring.datasource.url=jdbc:mariadb://localhost:3306/sgv?serverTimezone=UTC&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=true

# Superadmin ghost account: not persisted in the database.
superadmin.username=superadmin
superadmin.password=SuperSecret123!

# Desktop-only application; no web server or Redis.
spring.cache.type=simple

