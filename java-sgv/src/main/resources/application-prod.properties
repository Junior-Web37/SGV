# =============================================
# PRODUCTION PROFILE (Flyway + MariaDB)
# Hibernate validates schema against Flyway-managed DB
# Activated via: --spring.profiles.active=prod or SPRING_PROFILES_ACTIVE env var
# =============================================
spring.main.web-application-type=none

# Database
spring.datasource.url=jdbc:mariadb://${DB_HOST:localhost}:3306/${DB_NAME:sgv}?serverTimezone=UTC&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# Hibernate — validate only (Flyway manages schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.repair-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=schema_version

# Desktop-only cache configuration
spring.cache.type=simple
