# =============================================
# DEFAULT PROFILE (XAMPP MySQL local database)
# =============================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=false
spring.flyway.out-of-order=true
spring.flyway.ignore-missing-migrations=true
spring.main.web-application-type=none
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/sgv?serverTimezone=UTC&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.properties.hibernate.format_sql=false

# All users must exist in the MySQL database.
# Ghost superadmin login has been removed.

# Desktop-only application; no web server or Redis.
spring.cache.type=simple

# =============================================
# LOGGING — errors go to file + console
# =============================================
logging.file.name=sgv.log
logging.file.max-size=10MB
logging.file.max-history=5
logging.level.com.sgv=INFO
logging.level.com.sgv.desktop=DEBUG
logging.level.com.sgv.service=INFO
logging.level.com.sgv.repository=WARN
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

