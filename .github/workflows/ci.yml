# =============================================
# SGV — GitHub Actions CI/CD Pipeline
# Triggers: push to main, PRs
# =============================================

name: SGV CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  JAVA_VERSION: '21'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================
  # JOB 1: Build & Unit Tests
  # =============================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_DATABASE: sgv
          MARIADB_USER: sgv
          MARIADB_PASSWORD: sgv123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Verify Maven settings
        run: cat ~/.m2/settings.xml 2>/dev/null || echo "No custom settings"

      - name: Build with Maven
        working-directory: java-sgv
        run: mvn -B -q clean package -DskipTests

      - name: Run unit tests (H2 profile)
        working-directory: java-sgv
        run: mvn -B test -Dspring.profiles.active=test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: sgv-jar
          path: java-sgv/target/*.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: java-sgv/target/surefire-reports/*.xml
          retention-days: 14

  # =============================================
  # JOB 2: Integration Tests (Testcontainers)
  # Ubuntu-latest has Docker pre-installed; Testcontainers auto-detects /var/run/docker.sock
  # =============================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Run integration tests (Testcontainers)
        working-directory: java-sgv
        run: mvn -B test -Dtest="**/*IntegrationTest" -Dspring.profiles.active=test

  # =============================================
  # JOB 3: Security scan (OWASP)
  # =============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: OWASP dependency check
        working-directory: java-sgv
        run: |
          mvn -B org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              -DskipProvidedScope=true \
              -D suppressionFile=.owasp-suppressions.xml 2>&1 || true

      - name: Upload dependency report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: java-sgv/target/dependency-check-report.html
          retention-days: 7
        if: always()

  # =============================================
  # JOB 4: Docker build & push (main branch only)
  # =============================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (for Maven)
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Extract version
        id: version
        run: echo "VERSION=$(mvn -f java-sgv/pom.xml help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.version.outputs.VERSION }}

  # =============================================
  # JOB 5: Deploy to server (main branch)
  # =============================================
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/sgv
            docker compose pull
            docker compose up -d --no-deps sgv-app
            docker image prune -f
