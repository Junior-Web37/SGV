# =============================================
# DOCKER PROFILE
# MariaDB provided by docker-compose for desktop evaluation
# Activated via: SPRING_PROFILES_ACTIVE=docker env var (from docker-compose.yml)
# DO NOT set spring.profiles.active here — that is set by the environment variable
# =============================================
spring.main.web-application-type=none

spring.datasource.url=jdbc:mariadb://sgv-db:3306/sgv?serverTimezone=UTC&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=sgv
spring.datasource.password=sgv123
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.locations=classpath:db/migration
spring.flyway.table=schema_version

spring.cache.type=simple
