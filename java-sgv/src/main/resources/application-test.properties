# =============================================
# TEST PROFILE (Testcontainers + H2 fallback)
# =============================================
spring.main.web-application-type=none

# H2 in-memory for unit tests (override in @Testcontainers tests)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MariaDB;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate — create schema for tests
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests (schema created by Hibernate)
spring.flyway.enabled=false

# Desktop-only cache configuration
spring.cache.type=simple
